variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SSL_NO_VERIFY: "1"
  GIT_CREDENTIALS: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.eng.renesas.com"

stages:
  - coding-check
  - build
  - test
  - verify

check-compliance:
  stage: coding-check
  tags:
    - RA_build
  before_script:
    # git credential config
    - git config --global credential.helper store
    - echo $GIT_CREDENTIALS > ~/.git-credentials
    # init zephyr workspace
    - if [[ ! -d "$CI_PROJECT_DIR/../.west" ]]; then
      west init -l $CI_PROJECT_DIR;
      fi
    # update west module
    - west config fetch.parallel 4
    - west update
  script:
    # get BASE_HEAD
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - BASE_HEAD=$(git rev-parse origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME)
    - echo $BASE_HEAD
    # run compliance check with BASE_HEAD diff
    - python3 $CI_PROJECT_DIR/scripts/ci/check_compliance.py --annotate -e KconfigBasic -e YAMLLint -c ${BASE_HEAD}..
    # check-warns - Refer from .github/workflows/compliance.yml
    - if [[ ! -s "compliance.xml" ]]; then
      check=1;
      else
      check=0;
      cat compliance.xml;
      fi
    - test $check -eq 0
    - files=`python3 scripts/ci/check_compliance.py -l`
    - for file in "${files[@]}"; do
      f="${file}.txt";
      if [[ -s $f ]]; then
      check=1;
      cat $f;
      rm $f;
      fi
      done
    - test $check -eq 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true

verify_job:
  stage: verify
  script:
    - if [ -n "$(grep 'failed' <<< $(gitlab-ci-status))" ]; then
      echo "One or more jobs failed.";
      exit 1;
      else
      echo "All jobs succeeded.";
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

