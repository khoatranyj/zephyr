# default build job
.build-job:
  variables:
    GIT_DEPTH: 1
  tags:
    - RA_build
  before_script:
    # git credential config
    - git config --global credential.helper store
    - echo $GIT_CREDENTIALS > ~/.git-credentials
    # init zephyr workspace
    - if [[ ! -d "$CI_PROJECT_DIR/../.west" ]]; then
      west init -l $CI_PROJECT_DIR;
      fi
    # update west module
    - west config fetch.parallel 4
    - west update --narrow
    # add additional supported test in board metadata
    - if [ -n "$ADDITIONAL_SUPPORTED" ]; then
      IFS=' ' read -r -a members <<< $ADDITIONAL_SUPPORTED;
      for member in "${members[@]}"; do
      sed -i "/supported:/a\  - $member" "boards/renesas/$BOARD/$BOARD.yaml";
      done
      fi
    - cat boards/renesas/$BOARD/$BOARD.yaml
  script:
    - TAGS="-t drivers"
    - if [ -n "$ADDITIONAL_TAGS" ]; then
      IFS=' ' read -r -a tags <<< $ADDITIONAL_TAGS;
      for tag in "${tags[@]}"; do
      TAGS+=" -t $tag";
      done
      fi
    - TWISTER_BUILD_CMD="west twister --prep-artifacts-for-testing --outdir $CI_PROJECT_DIR/twister_out -p $BOARD $TAGS"
    - echo $TWISTER_BUILD_CMD
    - $TWISTER_BUILD_CMD
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/twister_out"
    when: always
    expire_in: 10 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# default test job
.test-job:
  variables:
    ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-${ZEPHYR_SDK_VERSION}
    SEGGER_JLINK_INSTALL_DIR: /opt/JLink
    GIT_DEPTH: 1
  before_script:
    # install the minimal required dependencies:
    - sudo apt install --no-install-recommends git cmake ninja-build wget python3 python3-pip;
      cmake --version;
      python3 --version;
    # install ZephyrSDK
    - ZEPHYR_SDK_VERSION=$(cat $CI_PROJECT_DIR/SDK_VERSION)
    - if [ ! -d "$ZEPHYR_SDK_INSTALL_DIR" ]; then
      wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-aarch64_minimal.tar.xz;
      tar xvf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-aarch64_minimal.tar.xz;
      sudo mv zephyr-sdk-${ZEPHYR_SDK_VERSION} $ZEPHYR_SDK_INSTALL_DIR;
      $ZEPHYR_SDK_INSTALL_DIR/setup.sh -t arm-zephyr-eabi -h -c;
      fi
    # install west
    - pip install west --break-system-packages
    # init zephyrworkspace
    - if [[ ! -d "$CI_PROJECT_DIR/../.west" ]]; then
      west init -l $CI_PROJECT_DIR;
      fi
    - source $CI_PROJECT_DIR/zephyr-env.sh
    - west zephyr-export
    # install additional Python dependencies
    - pip install -r $CI_PROJECT_DIR/scripts/requirements.txt --break-system-packages
    # install Segger JLink
    - if [ ! -d "$SEGGER_JLINK_INSTALL_DIR" ]; then
      wget --post-data 'accept_license_agreement=accepted&non_emb_ctr=confirmed&submit=Download+software' https://www.segger.com/downloads/jlink/JLink_Linux_arm64.tgz;
      tar xvf JLink_Linux_arm64.tgz;
      sudo mv JLink_Linux_*_arm64 $SEGGER_JLINK_INSTALL_DIR; sudo chmod a-w $SEGGER_JLINK_INSTALL_DIR;
      sudo cp $SEGGER_JLINK_INSTALL_DIR/99-jlink.rules /etc/udev/rules.d/;
      sudo udevadm control --reload-rules && sudo udevadm trigger;
      fi
  script:
    - echo "Running tests for $BOARD"
    - export PATH="/home/pi/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/games:/usr/games:/home/pi/.local/bin:/home/pi/.local/bin:$SEGGER_JLINK_INSTALL_DIR"
    - if [ -n "$FIXTURES" ]; then
      IFS=' ' read -r -a harnesses <<< $FIXTURES;
      for harness in "${harnesses[@]}"; do
      HARNESSES+=" --fixture $harness";
      done
      fi
    - TWISTER_TEST_CMD="west twister --device-testing --outdir $CI_PROJECT_DIR/twister_out --test-only --west-flash="--skip-rebuild,--dev-id=$SN" -p $BOARD $HARNESSES --device-serial $COM --device-flash-timeout 60 --log-level=DEBUG"
    - echo $TWISTER_TEST_CMD
    - $TWISTER_TEST_CMD
  after_script:
    - cat $CI_PROJECT_DIR/twister_out/twister.log
  artifacts:
    paths:
      - "$CI_PROJECT_DIR/twister_out/**/*.log"
    when: always
    expire_in: 10 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
